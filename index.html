<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة النتائج - Task 3</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container my-4">
  <h1 class="text-center mb-4">نظام إدارة النتائج</h1>
  <div class="card p-4 mb-3">
    <input id="studentName" type="text" class="form-control mb-2" placeholder="اسم الطالب">
    <input id="grade1" type="number" class="form-control mb-2" placeholder="درجة المادة الأولى (0 - 100)">
    <input id="grade2" type="number" class="form-control mb-2" placeholder="درجة المادة الثانية (0 - 100)">
    <input id="grade3" type="number" class="form-control mb-2" placeholder="درجة المادة الثالثة (0 - 100)">
    <input id="attendance" type="number" class="form-control mb-3" placeholder="نسبة الحضور (0 - 100)">
    <button id="addBtn" class="btn btn-primary w-100 mb-2">إضافة طالب</button>
    <button id="raafaBtn" class="btn btn-warning w-100">تفعيل لجنة الرأفة</button>
  </div>
  <div id="errorBox" class="alert alert-danger d-none"></div>
  <h4>قائمة الطلاب</h4>
  <div id="studentsListDiv" class="card p-3 mb-3">لم يتم إضافة طلاب بعد</div>
  <h4>التقرير النهائي للجنة الرأفة</h4>
  <div id="reportDiv" class="card p-3">اضغط على زر لجنة الرأفة لعرض التقرير</div>
</div>
<script src="js/main.js"></script>
</body>
</html>
